,298.62 L789.2,298.86 L792.8,299.12 L796.4,299.38 L800,299.63" fill="none" stroke="#f0c040" stroke-width="2.2"/><text x="80" y="138" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">deflection</text><line x1="80" y1="150" x2="800" y2="150" stroke="#20293a" stroke-width="1" stroke-dasharray="2 6"/><text x="800" y="144" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="end">crown deflection = elasticity x atan(c / D)</text><text x="18" y="374" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">c = pegs.size + tipWidth / 2. D is the pin-to-peg gap, so a long tongue bends less.</text><text x="18" y="390" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">After the release the spring takes over: stiffness pulls back, damping ends the ringing.</text><text x="18" y="406" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">At speed a peg clears the zone inside one frame and the tongue is flicked to the crown.</text></svg>
