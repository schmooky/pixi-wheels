 text-anchor="start">u is the peg's position along its own rim, in px, measured against the tongue's rest axis.</text><line x1="80" y1="300" x2="800" y2="300" stroke="#20293a" stroke-width="1.4"/><line x1="170" y1="130" x2="170" y2="310" stroke="#5ec8f2" stroke-width="1" stroke-dasharray="3 4"/><text x="170" y="328" fill="#5ec8f2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="middle">-c  first touch</text><line x1="337.14" y1="130" x2="337.14" y2="310" stroke="#f0c040" stroke-width="1" stroke-dasharray="3 4"/><text x="337.14" y="328" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="middle">0  the crown</text><line x1="504.29" y1="130" x2="504.29" y2="310" stroke="#7ee787" stroke-width="1" stroke-dasharray="3 4"/><text x="504.29" y="328" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="middle">c  peg is through</text><line x1="563.43" y1="130" x2="563.43" y2="328" stroke="#ff6ac1" stroke-width="1" stroke-dasharray="3 4"/><text x="563.43" y="346" fill="#ff6ac1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="middle">c(1+friction)  let go</text><line x1="90" y1="358" x2="790" y2="358" stroke="#8b98a9" stroke-width="1.2" marker-end="url(#head-8b98a9)"/><text x="790" y="350" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="end">direction of travel</text><path d="M80,300 L83.6,300 L87.2,300 L90.8,300 L94.4,300 L98,300 L101.6,300 L105.2,300 L108.8,300 L112.4,300 L116,300 L119.6,300 L123.2,300 L126.8,300 L130.4,300 L134,300 L137.6,300 L141.2,300 L144.8,300 L148.4,300 L152,300 L155.6,300 L159.2,300 L162.8,300 L166.4,300 L170,300 L173.6,296.66 L177.2,293.32 L180.8,289.98 L184.4,286.64 L188,283.3 L191.6,279.96 L195.2,276.63 L198.8,273.3