<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-label="Where the tongue sits and what it touches"><defs><marker id="head-f0c040" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f0c040"/></marker><marker id="tail-f0c040" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#f0c040"/></marker><marker id="head-5ec8f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5ec8f2"/></marker><marker id="tail-5ec8f2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#5ec8f2"/></marker><marker id="head-7ee787" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7ee787"/></marker><marker id="tail-7ee787" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#7ee787"/></marker><marker id="head-ff6ac1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ff6ac1"/></marker><marker id="tail-ff6ac1" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#ff6ac1"/></marker></defs><title>Where the tongue sits and what it touches</title><rect width="880" height="460" rx="14" fill="#0d1117"/><rect x="0.5" y="0.5" width="879" height="459" rx="14" fill="none" stroke="#20293a"/><text x="24" y="34" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="start">The tongue and the pegs</text><text x="24" y="54" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">Everything is measured from the hub. The tongue pivots at its pin and never moves off it.</text><circle cx="330" cy="620" r="380" fill="none" stroke="#20293a" stroke-width="1.6"/><circle cx="330" cy="620" r="346" fill="none" stroke="#20293a" stroke-width="1" stroke-dasharray="4 4"/><circle cx="126.63" cy="340.08" r="8" fill="#2b3550" stroke="#5ec8f2" stroke-width="1.3"/><circle cx="172.92" cy="311.71" r="8" fill="#2b3550" stroke="#5ec8f2" stroke-width="1.3"/><circle cx="223.08" cy="290.93" r="8" fill="#2b3550" stroke="#5ec8f2" stroke-width="1.3"/><circle cx="275.87" cy="278.26" r="8" fill="#2b3550" stroke="#5ec8f2" stroke-width="1.3"/><circle cx="330" cy="274" r="8" fill="#2b3550" stroke="#5ec8f2" stroke-width="1.3"/><circle cx="384.13" cy="278.26" r="8" fill="#2b3550" stroke="#5ec8f2" stroke-width="1.3"/><circle cx="436.92" cy="290.93" r="8" fill="#2b3550" stroke="#5ec8f2" stroke-width="1.3"/><circle cx="487.08" cy="311.71" r="8" fill="#2b3550" stroke="#5ec8f2" stroke-width="1.3"/><circle cx="533.37" cy="340.08" r="8" fill="#2b3550" stroke="#5ec8f2" stroke-width="1.3"/><path d="M310,180 C308,220 318,248 330,258 C342,248 352,220 350,180 z" fill="#f6f7fb" stroke="#20293a" stroke-width="2"/><circle cx="330" cy="180" r="7" fill="#20293a"/><circle cx="330" cy="180" r="3" fill="#f6f7fb"/><circle cx="330" cy="180" r="3.5" fill="#f0c040"/><text x="342" y="172" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">pin</text><circle cx="330" cy="258" r="3.5" fill="#7ee787"/><text x="346" y="262" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">tip</text><line x1="210" y1="258" x2="210" y2="240" stroke="#ff6ac1" stroke-width="1.3" marker-end="url(#head-ff6ac1)" marker-start="url(#tail-ff6ac1)"/><text x="198" y="253" fill="#ff6ac1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="end">tipInset</text><line x1="450" y1="180" x2="450" y2="258" stroke="#f0c040" stroke-width="1.3" marker-end="url(#head-f0c040)" marker-start="url(#tail-f0c040)"/><text x="462" y="223" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">skin.length</text><line x1="140" y1="240" x2="520" y2="240" stroke="#20293a" stroke-width="1" stroke-dasharray="3 3"/><text x="134" y="244" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="end">rim R</text><line x1="140" y1="274" x2="520" y2="274" stroke="#20293a" stroke-width="1" stroke-dasharray="3 3"/><text x="134" y="278" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="end">R - pegs.inset</text><line x1="304" y1="308" x2="356" y2="308" stroke="#5ec8f2" stroke-width="1.2" marker-end="url(#head-5ec8f2)" marker-start="url(#tail-5ec8f2)"/><text x="330" y="324" fill="#5ec8f2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="middle">contact width 2c = 2 x (pegs.size + tipWidth / 2)</text><text x="600" y="104" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">angle</text><text x="600" y="119" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="start">-90 is twelve o'clock, 90 is six</text><text x="600" y="144" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">facing</text><text x="600" y="159" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="start">inward from the rim, or outward</text><text x="600" y="184" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">tipInset</text><text x="600" y="199" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="start">how far the tip reaches past the rim</text><text x="600" y="224" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">skin.length</text><text x="600" y="239" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="start">pin to tip: pinRadius is the sum</text><text x="600" y="264" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">pegs.inset</text><text x="600" y="279" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="start">peg centres inside the rim</text><text x="600" y="304" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">pegs.size</text><text x="600" y="319" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="start">peg radius, half the contact width</text><text x="600" y="344" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">pegs.angles</text><text x="600" y="359" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="start">every divider unless you say otherwise</text></svg>
