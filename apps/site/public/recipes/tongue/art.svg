<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-label="What pointer art has to declare"><defs><marker id="head-f0c040" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f0c040"/></marker><marker id="tail-f0c040" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#f0c040"/></marker><marker id="head-5ec8f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5ec8f2"/></marker><marker id="tail-5ec8f2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#5ec8f2"/></marker><marker id="head-7ee787" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7ee787"/></marker><marker id="tail-7ee787" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#7ee787"/></marker></defs><title>What pointer art has to declare</title><rect width="880" height="380" rx="14" fill="#0d1117"/><rect x="0.5" y="0.5" width="879" height="379" rx="14" fill="none" stroke="#20293a"/><text x="24" y="34" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="start">Pointer art: tip direction and pin</text><text x="24" y="54" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">The engine rotates the art so the tip points at the hub, around the pin. Both are yours to state.</text><rect x="60" y="96" width="180" height="250" rx="0" fill="#161b22" stroke="#ff6ac1" stroke-width="1.1" stroke-dasharray="5 4"/><path d="M150,112 C184,206 190,276 180,314 L120,314 C110,276 116,206 150,112 z" fill="#f0c040" stroke="#8a6a10" stroke-width="2"/><line x1="60" y1="308.5" x2="240" y2="308.5" stroke="#5ec8f2" stroke-width="1" stroke-dasharray="3 3"/><line x1="150" y1="96" x2="150" y2="346" stroke="#5ec8f2" stroke-width="1" stroke-dasharray="3 3"/><circle cx="150" cy="308.5" r="5" fill="#5ec8f2"/><text x="150" y="368" fill="#5ec8f2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="middle">pin { x: 0.5, y: 0.85 }</text><line x1="84" y1="308.5" x2="84" y2="112" stroke="#f0c040" stroke-width="1.3" marker-end="url(#head-f0c040)" marker-start="url(#tail-f0c040)"/><text x="76" y="202.25" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="end">length</text><text x="150" y="88" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="middle">tip on the top edge: artDirection 'up'</text><text x="300" y="108" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">artDirection</text><text x="300" y="123" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="start">'up' | 'right' | 'down' | 'left': where the tip is in the source image</text><text x="300" y="148" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">pin</text><text x="300" y="163" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="start">fractions of the image; the pivot the flap swings around</text><text x="300" y="188" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">length</text><text x="300" y="203" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="start">pin to tip after scaling; sets where the tip lands on the rim</text><text x="300" y="228" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">scale</text><text x="300" y="243" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="start">uniform; art is usually authored larger than it is drawn</text><text x="300" y="268" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">padding</text><text x="300" y="283" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="start">leave a few transparent px at the tip so a trim cannot clip it</text><text x="300" y="308" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">deflection</text><text x="300" y="323" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="start">the sprite rotates; the pin never moves</text><text x="300" y="352" fill="#5ec8f2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">SpinePointerSkin takes the same length, plus idle and tick animation names.</text></svg>
