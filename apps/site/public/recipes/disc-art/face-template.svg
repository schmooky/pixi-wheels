<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="What a face texture has to match"><defs><marker id="head-f0c040" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f0c040"/></marker><marker id="tail-f0c040" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#f0c040"/></marker><marker id="head-5ec8f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5ec8f2"/></marker><marker id="tail-5ec8f2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#5ec8f2"/></marker><marker id="head-ff6ac1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ff6ac1"/></marker><marker id="tail-ff6ac1" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#ff6ac1"/></marker></defs><title>What a face texture has to match</title><rect width="880" height="470" rx="14" fill="#0d1117"/><rect x="0.5" y="0.5" width="879" height="469" rx="14" fill="none" stroke="#20293a"/><text x="24" y="34" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="start">The face texture</text><text x="24" y="54" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">Square, centred, transparent outside the disc. One image, the whole wheel.</text><rect x="60" y="100" width="300" height="300" rx="0" fill="none" stroke="#ff6ac1" stroke-width="1.2" stroke-dasharray="5 4"/><circle cx="210" cy="250" r="150" fill="#161b22" stroke="#5ec8f2" stroke-width="1.6"/><line x1="210" y1="250" x2="360" y2="250" stroke="#20293a" stroke-width="1"/><line x1="210" y1="250" x2="339.9" y2="325" stroke="#20293a" stroke-width="1"/><line x1="210" y1="250" x2="285" y2="379.9" stroke="#20293a" stroke-width="1"/><line x1="210" y1="250" x2="210" y2="400" stroke="#20293a" stroke-width="1"/><line x1="210" y1="250" x2="135" y2="379.9" stroke="#20293a" stroke-width="1"/><line x1="210" y1="250" x2="80.1" y2="325" stroke="#20293a" stroke-width="1"/><line x1="210" y1="250" x2="60" y2="250" stroke="#20293a" stroke-width="1"/><line x1="210" y1="250" x2="80.1" y2="175" stroke="#20293a" stroke-width="1"/><line x1="210" y1="250" x2="135" y2="120.1" stroke="#20293a" stroke-width="1"/><line x1="210" y1="250" x2="210" y2="100" stroke="#20293a" stroke-width="1"/><line x1="210" y1="250" x2="285" y2="120.1" stroke="#20293a" stroke-width="1"/><line x1="210" y1="250" x2="339.9" y2="175" stroke="#20293a" stroke-width="1"/><line x1="210" y1="250" x2="360" y2="250" stroke="#f0c040" stroke-width="2"/><path d="M254,250 A44,44 0 0 1 248.11,272" fill="none" stroke="#f0c040" stroke-width="1.6"/><text x="262" y="272" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">section 0</text><circle cx="210" cy="250" r="3" fill="#f0c040"/><line x1="46" y1="250" x2="374" y2="250" stroke="#20293a" stroke-width="1" stroke-dasharray="2 4"/><line x1="210" y1="86" x2="210" y2="414" stroke="#20293a" stroke-width="1" stroke-dasharray="2 4"/><line x1="60" y1="426" x2="360" y2="426" stroke="#f0c040" stroke-width="1.3" marker-end="url(#head-f0c040)" marker-start="url(#tail-f0c040)"/><text x="210" y="444" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="middle">width = 2 x outerRadius</text><text x="368" y="244" fill="#5ec8f2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">0 deg</text><text x="54" y="92" fill="#ff6ac1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">transparent</text><circle cx="432" cy="116" r="3" fill="#5ec8f2"/><text x="446" y="120" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="start">square, power of two</text><text x="446" y="136" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">1024 x 1024 is plenty for a 300 px wheel on a 2x screen</text><circle cx="432" cy="160" r="3" fill="#5ec8f2"/><text x="446" y="164" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="start">centre = image centre</text><text x="446" y="180" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">the sprite is anchored 0.5, 0.5 and never moved</text><circle cx="432" cy="204" r="3" fill="#5ec8f2"/><text x="446" y="208" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="start">0 deg is three o'clock</text><text x="446" y="224" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">angles grow clockwise, the way the wheel turns</text><circle cx="432" cy="248" r="3" fill="#5ec8f2"/><text x="446" y="252" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="start">section 0 starts where you say</text><text x="446" y="268" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">art drawn from twelve o'clock needs faceRotation: -90</text><circle cx="432" cy="292" r="3" fill="#5ec8f2"/><text x="446" y="296" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="start">corners transparent</text><text x="446" y="312" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">a frame or a bezel goes on the fixed overlay, not here</text><circle cx="432" cy="336" r="3" fill="#5ec8f2"/><text x="446" y="340" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="start">no labels if they change</text><text x="446" y="356" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">server-driven values are rich labels on top</text></svg>
