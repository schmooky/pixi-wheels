<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 332" width="100%" role="img" aria-label="How a plate sprite is authored" style="font-size:14px;fill:var(--fig-ink, #1a1a1e)"><defs><marker id="fig-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--fig-key, #b07d12)"/></marker><marker id="fig-tail" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="var(--fig-key, #b07d12)"/></marker></defs><title>How a plate sprite is authored</title><rect x="295" y="30" width="210" height="240" rx="0" fill="none" stroke="var(--fig-line, #d6d8dd)" stroke-width="1.6" stroke-dasharray="6 5"/><path d="M317,50 L483,50 L450,250 L350,250 z" fill="var(--fig-wash, rgba(20,22,28,0.05))" stroke="var(--fig-ink, #1a1a1e)" stroke-width="2.2"/><line x1="400" y1="24" x2="400" y2="276" stroke="var(--fig-line, #d6d8dd)" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="289" y1="150" x2="511" y2="150" stroke="var(--fig-line, #d6d8dd)" stroke-width="1.2" stroke-dasharray="4 4"/><circle cx="400" cy="150" r="5" fill="var(--fig-key, #b07d12)"/><line x1="400" y1="92" x2="400" y2="56" stroke="var(--fig-key, #b07d12)" stroke-width="1.8" marker-end="url(#fig-head)"/><text x="412" y="78" fill="var(--fig-key, #b07d12)" font-size="14" font-weight="500" text-anchor="start">up is outward</text><text x="529" y="155" fill="var(--fig-ink, #1a1a1e)" font-size="14" font-weight="500" text-anchor="start">anchor 0.5, 0.5</text><text x="400" y="304" fill="var(--fig-muted, #6b7280)" font-size="13.5" font-weight="500" text-anchor="middle">outer chord = 2 R sin(arc / 2)</text></svg>
