<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="Atlas regions: trimmed, rotated, padded"><defs><marker id="head-f0c040" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f0c040"/></marker><marker id="tail-f0c040" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#f0c040"/></marker><marker id="head-ff6ac1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#ff6ac1"/></marker><marker id="tail-ff6ac1" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#ff6ac1"/></marker><marker id="head-5ec8f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5ec8f2"/></marker><marker id="tail-5ec8f2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#5ec8f2"/></marker></defs><title>Atlas regions: trimmed, rotated, padded</title><rect width="880" height="360" rx="14" fill="#0d1117"/><rect x="0.5" y="0.5" width="879" height="359" rx="14" fill="none" stroke="#20293a"/><text x="24" y="34" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="start">Three things an atlas does to your art</text><text x="24" y="54" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">All three are normal. All three move the pivot if you read the rect and forget the rest.</text><rect x="40" y="100" width="220" height="150" rx="8" fill="#161b22" stroke="#20293a" stroke-width="1.2"/><rect x="80" y="120" width="140" height="110" rx="0" fill="none" stroke="#5ec8f2" stroke-width="1.6"/><path d="M110,215 L150,135 L190,215 z" fill="#243b53" stroke="#5ec8f2" stroke-width="1.2"/><text x="150" y="278" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">packed as drawn</text><text x="150" y="296" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="middle">frame is the whole sprite;</text><text x="150" y="311" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="middle">the pivot is its centre</text><rect x="320" y="100" width="220" height="150" rx="8" fill="#161b22" stroke="#20293a" stroke-width="1.2"/><rect x="360" y="120" width="140" height="110" rx="0" fill="none" stroke="#20293a" stroke-width="1.2" stroke-dasharray="4 4"/><rect x="386" y="132" width="88" height="86" rx="0" fill="none" stroke="#f0c040" stroke-width="1.6"/><path d="M394,212 L430,138 L466,212 z" fill="#243b53" stroke="#f0c040" stroke-width="1.2"/><line x1="360" y1="126" x2="386" y2="126" stroke="#f0c040" stroke-width="1.1" marker-end="url(#head-f0c040)"/><text x="366" y="118" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400" text-anchor="start">offset</text><text x="430" y="278" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">trimmed</text><text x="430" y="296" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="middle">transparent edges cut off:</text><text x="430" y="311" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="middle">add the offsets back or it drifts</text><rect x="600" y="100" width="220" height="150" rx="8" fill="#161b22" stroke="#20293a" stroke-width="1.2"/><rect x="652" y="126" width="116" height="98" rx="0" fill="none" stroke="#ff6ac1" stroke-width="1.6"/><g transform="translate(710,175) rotate(-90)"><path d="M-36,40 L0,-38 L36,40 z" fill="#243b53" stroke="#ff6ac1" stroke-width="1.2"/></g><text x="710" y="244" fill="#ff6ac1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400" text-anchor="middle">90 deg CCW</text><text x="710" y="278" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="600" text-anchor="middle">rotated</text><text x="710" y="296" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="middle">stored 90 deg CCW: PixiJS</text><text x="710" y="311" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="400" text-anchor="middle">rotate 6, width and height swap</text></svg>
