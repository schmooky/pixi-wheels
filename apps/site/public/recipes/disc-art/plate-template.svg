<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="What a per-section plate sprite has to match"><defs><marker id="head-f0c040" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f0c040"/></marker><marker id="tail-f0c040" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#f0c040"/></marker><marker id="head-5ec8f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5ec8f2"/></marker><marker id="tail-5ec8f2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#5ec8f2"/></marker><marker id="head-7ee787" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7ee787"/></marker><marker id="tail-7ee787" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#7ee787"/></marker></defs><title>What a per-section plate sprite has to match</title><rect width="880" height="420" rx="14" fill="#0d1117"/><rect x="0.5" y="0.5" width="879" height="419" rx="14" fill="none" stroke="#20293a"/><text x="24" y="34" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="start">One plate per section</text><text x="24" y="54" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">When the art is per wedge, ship one sprite and let the geometry place twelve of them.</text><rect x="60" y="110" width="190" height="240" rx="0" fill="#161b22" stroke="#ff6ac1" stroke-width="1.1" stroke-dasharray="5 4"/><path d="M80,128 L230,128 L201,332 L109,332 z" fill="#3a1220" stroke="#f