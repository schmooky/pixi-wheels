dth="1.2" opacity="0.45"/></g><g transform="translate(606.8,321.06) rotate(150)"><path d="M-22,-26 L22,-26 L13,26 L-13,26 z" fill="#3a1220" stroke="#f0c040" stroke-width="1.2" opacity="0.45"/></g><g transform="translate(560,333.6) rotate(180)"><path d="M-22,-26 L22,-26 L13,26 L-13,26 z" fill="#3a1220" stroke="#f0c040" stroke-width="1.2" opacity="0.45"/></g><g transform="translate(513.2,321.06) rotate(210)"><path d="M-22,-26 L22,-26 L13,26 L-13,26 z" fill="#3a1220" stroke="#f0c040" stroke-width="1.2" opacity="0.45"/></g><g transform="translate(478.94,286.8) rotate(240)"><path d="M-22,-26 L22,-26 L13,26 L-13,26 z" fill="#3a1220" stroke="#f0c040" stroke-width="1.2" opacity="0.45"/></g><g transform="translate(466.4,240) rotate(270)"><path d="M-22,-26 L22,-26 L13,26 L-13,26 z" fill="#3a1220" stroke="#f0c040" stroke-width="1.2" opacity="0.45"/></g><g transform="translate(478.94,193.2) rotate(300)"><path d="M-22,-26 L22,-26 L13,26 L-13,26 z" fill="#3a1220" stroke="#f0c040" stroke-width="1.2" opacity="0.45"/></g><g transform="translate(513.2,158.94) rotate(330)"><path d="M-22,-26 L22,-26 L13,26 L-13,26 z" fill="#3a1220" stroke="#f0c040" stroke-width="1.2" opacity="0.45"/></g><line x1="560" y1="240" x2="560" y2="110" stroke="#5ec8f2" stroke-width="1.2" stroke-dasharray="3 3"/><text x="560" y="98" fill="#5ec8f2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="middle">midAngle of the section</text><text x="700" y="244" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">radius 0.72 x R</text><text x="18" y="390" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">sprite.rotation = midAngle + 90 deg, so the art's up points at the rim; radius is a fraction of outerRadius.</text><text x="18" y="406" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">Weights move the plates: TextureRingSkin re-places them from layout(), a custom skin re-reads ctx.geometry.</text></svg>
