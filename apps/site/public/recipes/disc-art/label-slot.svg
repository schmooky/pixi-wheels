<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="The room a label has inside its wedge"><defs><marker id="head-f0c040" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#f0c040"/></marker><marker id="tail-f0c040" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#f0c040"/></marker><marker id="head-5ec8f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#5ec8f2"/></marker><marker id="tail-5ec8f2" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#5ec8f2"/></marker><marker id="head-7ee787" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7ee787"/></marker><marker id="tail-7ee787" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M9,1 L0,5 L9,9 z" fill="#7ee787"/></marker></defs><title>The room a label has inside its wedge</title><rect width="880" height="400" rx="14" fill="#0d1117"/><rect x="0.5" y="0.5" width="879" height="399" rx="14" fill="none" stroke="#20293a"/><text x="24" y="34" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" text-anchor="start">labelSlot: the box a label is fitted into</text><text x="24" y="54" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="400" text-anchor="start">Width is the chord at the label radius; height is how much of the radius the label may eat.</text><circle cx="250" cy="240" r="145" fill="#161b22" stroke="#20293a" stroke-width="1.2"/><path d="M250,240 L166.83,121.22 166.83,121.22 A145,145 0 0 1 333.17,121.22 z" fill="#132033" stroke="#5ec8f2" stroke-width="1.4"/><line x1="190.12" y1="154.48" x2="309.88" y2="154.48" stroke="#f0c040" stroke-width="1.8"/><line x1="190.12" y1="154.48" x2="150.12" y2="128.48" stroke="#f0c040" stroke-width="1" stroke-dasharray="3 3"/><text x="146.12" y="126.48" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="end">chordAt(radius)</text><rect x="190.12" y="154.48" width="119.76" height="46" rx="0" fill="none" stroke="#7ee787" stroke-width="1.4" stroke-dasharray="4 3"/><line x1="309.88" y1="200.48" x2="343.88" y2="216.48" stroke="#7ee787" stroke-width="1" stroke-dasharray="3 3"/><text x="347.88" y="220.48" fill="#7ee787" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">the slot</text><line x1="250" y1="240" x2="250" y2="95" stroke="#5ec8f2" stroke-width="1" stroke-dasharray="3 3"/><text x="242" y="178" fill="#5ec8f2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="end">labelRadius</text><text x="470" y="96" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="start">labelFit</text><text x="470" y="120" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">fit</text><text x="534" y="120" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">scale down only, keep the aspect</text><text x="470" y="146" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">fill</text><text x="534" y="146" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">scale up too, so short text grows</text><text x="470" y="172" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">width</text><text x="534" y="172" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">only the chord matters</text><text x="470" y="198" fill="#f0c040" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">none</text><text x="534" y="198" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">place it, do not touch the scale</text><text x="470" y="234" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" text-anchor="start">orientation</text><text x="470" y="258" fill="#5ec8f2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">radial</text><text x="590" y="258" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">reads out from the hub</text><text x="470" y="284" fill="#5ec8f2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">tangential</text><text x="590" y="284" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">along the arc, top out</text><text x="470" y="310" fill="#5ec8f2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">tangential-in</text><text x="590" y="310" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">along the arc, top toward the hub</text><text x="470" y="336" fill="#5ec8f2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" text-anchor="start">upright</text><text x="590" y="336" fill="#8b98a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="400" text-anchor="start">never rotates, for icons and faces</text></svg>
